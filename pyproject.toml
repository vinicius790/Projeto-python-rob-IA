[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "robia-ops"
version = "3.0.0"
description = "Production-oriented workforce and payment operations platform with auditability, sandbox processing and analytics."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Projeto-python-rob-IA contributors"}]
keywords = ["fastapi", "payroll", "payments", "sqlalchemy", "analytics", "portfolio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0.50,<2.2",
  "pydantic>=2.12,<3.0",
  "pydantic-settings>=2.12,<3.0",
  "alembic>=1.18,<2.0",
  "jinja2>=3.1,<4.0",
  "typer>=0.20,<1.0",
  "rich>=14,<16",
  "prometheus-client>=0.23,<1.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.8,<2.0", "numpy>=2.0,<3.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]
dev = [
  "pytest>=9.0,<10.0",
  "pytest-cov>=7.0,<8.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.13,<1.0",
  "mypy>=1.18,<3.0",
  "build>=1.3,<2.0",
  "pip-audit>=2.9,<3.0",
  "pre-commit>=4.0,<5.0",
]

[project.scripts]
robia = "robia_ops.cli:app"

[project.urls]
Repository = "https://github.com/vinicius790/Projeto-python-rob-IA"
Documentation = "https://github.com/vinicius790/Projeto-python-rob-IA/tree/main/docs"
Issues = "https://github.com/vinicius790/Projeto-python-rob-IA/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robia_ops = ["web/templates/*.html", "web/static/*.css", "web/static/*.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: tests requiring external infrastructure such as PostgreSQL",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["legacy", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.coverage.run]
branch = true
source = ["robia_ops"]
omit = ["src/robia_ops/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 88
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
packages = ["robia_ops"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
